<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İşlem Geçmişi | PAÜ Spor Merkezi</title>
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="bg-slate-50 text-slate-700 pb-10">

    <div class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="h-1 w-full bg-gradient-to-r from-gray-700 via-gray-900 to-black"></div>
        <div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="admin.html" class="flex items-center gap-2 text-slate-500 hover:text-slate-800 transition font-bold text-sm">
                    <span>◀</span> Yönetici Paneli
                </a>
                <div class="h-6 w-px bg-slate-200"></div>
                <h1 class="text-lg font-black text-slate-800 tracking-tight">İŞLEM GEÇMİŞİ (LOGS)</h1>
            </div>
            <button onclick="loadLogs()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold transition">Yenile</button>
        </div>
    </div>

    <div class="max-w-[1200px] mx-auto px-4 mt-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="hidden md:table-header-group"> <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
        <th class="p-4 w-20">ID</th>
        <th class="p-4 w-40">Kullanıcı</th>
        <th class="p-4 w-40">İşlem</th>
        <th class="p-4">Detay</th>
        <th class="p-4 w-48 text-right">Tarih</th>
    </tr>
</thead>
                    <tbody id="logsTableBody" class="text-sm divide-y divide-slate-100">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-400">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
<div class="flex items-center justify-between p-4 border-t border-slate-100 bg-slate-50/50">
            <div class="text-sm text-slate-500 font-medium">
                Toplam <span id="totalLogs" class="text-slate-800 font-bold">0</span> kayıt, 
                Sayfa <span id="pageIndicator" class="text-slate-800 font-bold">1</span>
            </div>
            <div class="flex gap-2">
                <button id="btnPrev" onclick="changePage(-1)" class="bg-white border border-slate-300 text-slate-600 px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                    ◀ Önceki
                </button>
                <button id="btnNext" onclick="changePage(1)" class="bg-white border border-slate-300 text-slate-600 px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                    Sonraki ▶
                </button>
            </div>
        </div>
        </div>
    </div>

    <script src="js/core/api-endpoints.js"></script>
    <script src="js/logs.js"></script>
</body>
</html>
