<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAÜ Spor Merkezi | Canlı Shift Ekranı</title>
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        body { 
            background-color: #f8fafc; 
            color: #334155; 
            font-family: 'Barlow', sans-serif; 
        }
        .gradient-bar { 
            background: linear-gradient(90deg, #334155 0%, #1e293b 50%, #0f172a 100%); 
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .status-pulse {
            animation: pulse-green 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-green {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .time-cell {
            min-width: 120px;
            position: sticky;
            left: 0;
            background: white;
            z-index: 10;
        }
        
        .unit-cell {
            min-width: 450px;
        }
        
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
        }
        
        .staff-card {
            min-width: 0;
            text-align: center;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <div class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="gradient-bar h-1 w-full"></div>
        <div class="max-w-[1920px] mx-auto px-4 md:px-8 py-3 md:py-4 flex flex-row items-center justify-between">
            
            <div class="flex flex-row items-center gap-3 md:gap-4">
                <img src="img/logo.png" class="h-12 w-12 md:h-16 md:w-16 object-contain" onerror="this.style.display='none'">
                <div class="leading-tight">
                    <div class="text-[10px] md:text-xs font-bold tracking-[0.2em] text-slate-500 uppercase">PAMUKKALE ÜNİVERSİTESİ</div>
                    <div class="text-xl md:text-3xl font-black tracking-tight text-slate-900 leading-none mt-0.5">
                        SPOR MERKEZİ <span class="text-slate-600">• CANLI VARDİYALAR</span>
                    </div>
                </div>
            </div>

            <div class="text-right">
                <div id="clock" class="text-2xl md:text-5xl font-black text-slate-900 tabular-nums tracking-tight leading-none">00:00</div>
                <div id="date" class="text-slate-500 text-[9px] md:text-sm font-bold uppercase tracking-wider mt-0.5 md:mt-1">...</div>
                
                <!-- Personel Tipi Legend -->
                <div class="flex items-center gap-3 mt-3 justify-end">
                    <div class="flex items-center gap-1.5">
                        <div class="w-3 h-3 rounded border-2 border-slate-600" style="background-color: #D3DCE6;"></div>
                        <span class="text-[9px] md:text-xs font-bold text-slate-600">KADROLU</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <div class="w-3 h-3 rounded border-2 border-blue-600" style="background-color: #C5D9F1;"></div>
                        <span class="text-[9px] md:text-xs font-bold text-slate-600">KISMI ZAMANLI</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <div class="w-3 h-3 rounded border-2 border-green-600" style="background-color: #D7E4BD;"></div>
                        <span class="text-[9px] md:text-xs font-bold text-slate-600">İŞKUR</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT - TABLO -->
    <div class="flex-1 overflow-auto bg-slate-50 p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table id="shiftTable" class="w-full border-collapse">
                    <thead>
                        <tr class="bg-slate-800">
                            <th class="time-cell px-6 py-4 text-left">
                                <div class="text-white font-black text-sm uppercase tracking-wider">SAAT</div>
                            </th>
                            <!-- Birim başlıkları dinamik olarak eklenecek -->
                        </tr>
                    </thead>
                    <tbody id="shiftTableBody">
                        <tr>
                            <td colspan="100%" class="p-12 text-center">
                                <div class="flex items-center justify-center gap-4 text-slate-400">
                                    <svg class="w-10 h-10 animate-spin" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span class="text-xl font-bold">Yükleniyor...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/core/api-endpoints.js"></script>
    <script src="js/tv.js"></script>
</body>
</html>
